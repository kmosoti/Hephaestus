[workspace]
resolver = "3"
members = [
    "crates/bin/hephaestus-xtask",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.100.0"
license = "Apache-2.0"
repository = "https://github.com/kmosoti/Hephaestus"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
flate2 = "1.1.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
toml = "1.2.1"
zstd = "0.14.3"
