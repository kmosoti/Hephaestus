name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, Verify, and Package Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify commit ancestry on main and tag version match
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main
          pkg_ver="$(awk '/^\[workspace\.package\]/{in_pkg=1;next} /^\[/{in_pkg=0} in_pkg && /^version[[:space:]]*=/{gsub(/.*=[[:space:]]*"|".*/, ""); print; exit}' Cargo.toml)"
          test -n "${pkg_ver}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            test "${GITHUB_REF_NAME}" = "v${pkg_ver}"
            test -f "docs/releases/${GITHUB_REF_NAME}.md"
          fi

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Verify formatting, lints, layers, purity, pins, and tests
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo xtask check-layers
          cargo xtask check-core-purity
          cargo xtask check-workflow-pins
          cargo test --workspace --locked

      - name: Scan for leaked local paths or key material
        run: |
          if rg -n '/home/[a-zA-Z0-9._-]+|age1[0-9a-z]{50,}|BEGIN .* PRIVATE KEY' .; then
            echo "Forbidden local path or key material detected!"
            exit 1
          fi

      - name: Build .deb, .tar.zst, and SHA256SUMS
        run: |
          cargo xtask package-deb --out dist
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Generate RELEASE-EVIDENCE.json
        run: |
          deb_file="$(basename dist/*.deb)"
          tar_file="$(basename dist/*.tar.zst)"
          deb_sha="$(sha256sum dist/*.deb | awk '{print $1}')"
          tar_sha="$(sha256sum dist/*.tar.zst | awk '{print $1}')"
          sums_sha="$(sha256sum dist/SHA256SUMS | awk '{print $1}')"
          jq -n \
            --arg tag "${GITHUB_REF_NAME}" \
            --arg commit "${GITHUB_SHA}" \
            --arg toolchain "1.100.0" \
            --arg deb_file "${deb_file}" \
            --arg deb_sha "${deb_sha}" \
            --arg tar_file "${tar_file}" \
            --arg tar_sha "${tar_sha}" \
            --arg sums_sha "${sums_sha}" \
            '{
              schema: "hephaestus.release-evidence/v1",
              tag: $tag,
              commit: $commit,
              rust_toolchain: $toolchain,
              gates: {
                fmt: "passed",
                clippy_locked_deny_warnings: "passed",
                check_layers: "passed",
                check_core_purity: "passed",
                check_workflow_pins: "passed",
                workspace_tests_locked: "passed",
                privacy_scan: "zero_matches"
              },
              artifacts: {
                deb: { file: $deb_file, sha256: $deb_sha },
                tar_zst: { file: $tar_file, sha256: $tar_sha },
                sha256sums: { file: "SHA256SUMS", sha256: $sums_sha }
              }
            }' > dist/RELEASE-EVIDENCE.json

      - name: Upload packaged release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hephaestus-release-dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Attest and Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Re-verify main ancestry and release metadata
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main
          pkg_ver="$(awk '/^\[workspace\.package\]/{in_pkg=1;next} /^\[/{in_pkg=0} in_pkg && /^version[[:space:]]*=/{gsub(/.*=[[:space:]]*"|".*/, ""); print; exit}' Cargo.toml)"
          test -n "${pkg_ver}"
          test "${GITHUB_REF_NAME}" = "v${pkg_ver}"
          test -f "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Download verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hephaestus-release-dist
          path: dist

      - name: Verify artifact checksums
        run: (cd dist && sha256sum -c SHA256SUMS)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.tar.zst
            dist/SHA256SUMS
            dist/RELEASE-EVIDENCE.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          prerelease: true
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            dist/*.deb
            dist/*.tar.zst
            dist/SHA256SUMS
            dist/RELEASE-EVIDENCE.json
