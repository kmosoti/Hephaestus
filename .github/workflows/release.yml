name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package-and-release:
    name: Build, Verify, Attest, and Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Verify formatting, lints, layers, purity, pins, and tests
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo xtask check-layers
          cargo xtask check-core-purity
          cargo xtask check-workflow-pins
          cargo test --workspace --locked

      - name: Scan for leaked local paths or key material
        run: |
          if rg -n '/home/[a-zA-Z0-9._-]+|age1[0-9a-z]{50,}|BEGIN .* PRIVATE KEY' .; then
            echo "Forbidden local path or key material detected!"
            exit 1
          fi

      - name: Build .deb, .tar.zst, and SHA256SUMS
        run: cargo xtask package-deb --out dist

      - name: Generate RELEASE-EVIDENCE.json
        run: |
          deb_file="$(basename dist/*.deb)"
          tar_file="$(basename dist/*.tar.zst)"
          deb_sha="$(sha256sum dist/*.deb | awk '{print $1}')"
          tar_sha="$(sha256sum dist/*.tar.zst | awk '{print $1}')"
          sums_sha="$(sha256sum dist/SHA256SUMS | awk '{print $1}')"
          jq -n \
            --arg tag "${GITHUB_REF_NAME}" \
            --arg commit "${GITHUB_SHA}" \
            --arg toolchain "1.100.0" \
            --arg deb_file "${deb_file}" \
            --arg deb_sha "${deb_sha}" \
            --arg tar_file "${tar_file}" \
            --arg tar_sha "${tar_sha}" \
            --arg sums_sha "${sums_sha}" \
            '{
              schema: "hephaestus.release-evidence/v1",
              tag: $tag,
              commit: $commit,
              rust_toolchain: $toolchain,
              gates: {
                fmt: "passed",
                clippy_locked_deny_warnings: "passed",
                check_layers: "passed",
                check_core_purity: "passed",
                check_workflow_pins: "passed",
                workspace_tests_locked: "passed",
                privacy_scan: "zero_matches"
              },
              artifacts: {
                deb: { file: $deb_file, sha256: $deb_sha },
                tar_zst: { file: $tar_file, sha256: $tar_sha },
                sha256sums: { file: "SHA256SUMS", sha256: $sums_sha }
              }
            }' > dist/RELEASE-EVIDENCE.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.tar.zst
            dist/SHA256SUMS
            dist/RELEASE-EVIDENCE.json

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.deb
            dist/*.tar.zst
            dist/SHA256SUMS
            dist/RELEASE-EVIDENCE.json
