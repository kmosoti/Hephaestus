# Core purity policy enforced by `cargo xtask check-core-purity`.

[policy]
no_std = true
build_scripts = false
required_lints = [
    "clippy::unwrap_used",
    "clippy::expect_used",
    "clippy::panic",
    "clippy::todo",
    "clippy::unimplemented",
]

# Core crates under crates/core/ must be registered here.
[crates.hephaestus-core]

# Explicitly allowlisted pure no_std dependencies and their transitive closure.
[allow.base64]
default_features = false
features = ["alloc"]
transitive = []

[allow.blake3]
default_features = false
features = ["pure"]
transitive = ["arrayvec", "cfg-if", "constant_time_eq", "cpufeatures"]

[allow.ruzstd]
default_features = false
features = ["hash"]
transitive = ["twox-hash"]

[allow.serde]
default_features = false
features = ["alloc", "derive"]
transitive = ["proc-macro2", "quote", "serde_core", "serde_derive", "syn", "unicode-ident"]

[allow.sha2]
default_features = false
features = []
transitive = ["block-buffer", "cfg-if", "cpufeatures", "crypto-common", "digest", "hybrid-array", "typenum"]

[allow.thiserror]
default_features = false
features = []
transitive = ["proc-macro2", "quote", "syn", "thiserror-impl", "unicode-ident"]

# Denied dependency classes: never allowed directly or transitively in crates/core/.
[deny]
async-runtime = ["tokio", "async-std", "smol", "futures-executor", "actix-rt"]
network = ["reqwest", "hyper", "hyper-util", "tonic", "quinn", "quinn-proto", "quinn-udp", "rustls", "socket2", "mio", "axum"]
filesystem = ["tempfile", "walkdir", "notify", "fs_extra", "camino", "rusqlite", "object_store", "jj-lib"]
randomness = ["rand", "rand_core", "getrandom", "fastrand", "oorandom"]
clock = ["chrono", "time", "instant", "coarsetime"]
process = ["nix", "libc", "windows-sys", "rustix", "sysinfo", "procfs"]
logging = ["log", "tracing", "env_logger", "slog"]
